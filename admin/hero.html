<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Slides | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
        <header class="table-header">
            <h1>Hero Slides</h1>
            <button id="add-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add New Slide</button>
        </header>

        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Preview</th>
                        <th>Title</th>
                        <th>Order</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="hero-table-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="hero-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Add New Slide</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="hero-form">
                <div class="modal-body">
                    <input type="hidden" id="hero-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" required placeholder="Slide Title">
                    </div>
                    <div class="form-group">
                        <label for="subtitle">Subtitle</label>
                        <textarea id="subtitle" required placeholder="Brief description"></textarea>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="display_order">Display Order</label>
                            <input type="number" id="display_order" value="0">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <label class="switch">
                                <input type="checkbox" id="is_active" checked>
                                <span class="slider"></span>
                            </label>
                            <span style="font-size: 0.8rem; vertical-align: middle; margin-left: 10px;">Active</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="image_file">Slide Image</label>
                        <input type="file" id="image_file" accept=".jpg,.jpeg,.png,.webp">
                        <small style="color: var(--gray-500)">Max 5MB. Real type validated by magic bytes.</small>
                        <div class="image-preview-container" id="preview-box">
                            <img id="image-preview" src="" alt="Preview">
                        </div>
                        <input type="hidden" id="image_url">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Slide</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/security.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/hero-admin.js"></script>
</body>
</html>
