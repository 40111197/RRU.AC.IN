<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Superadmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
        <header class="table-header">
            <h1>User Management</h1>
            <button id="add-user-btn" class="page-action-btn"><i class="fas fa-plus"></i> Add User</button>
        </header>

        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- User Modal -->
    <div id="user-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Create New User</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="user-form">
                <div class="modal-body">
                    <input type="hidden" id="user-id">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div id="pass-group" class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Leave blank to keep current">
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="role">Role</label>
                            <select id="role">
                                <option value="editor">Editor</option>
                                <option value="admin">Admin</option>
                                <option value="superadmin">Superadmin</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Account Status</label>
                            <label class="switch">
                                <input type="checkbox" id="is_active" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel close-modal">Cancel</button>
                    <button type="submit" class="btn-modal-save">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/security.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/users-admin.js"></script>
</body>
</html>
