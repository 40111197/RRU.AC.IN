<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Management | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
        <header class="table-header">
            <h1>News & Announcements</h1>
            <button id="add-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Post News</button>
        </header>

        <div class="data-table-container">
            <div class="table-header" style="background:#f9fafb;">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="news-search" placeholder="Filter news...">
                </div>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Tag</th>
                        <th>Order</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="news-table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- News Modal -->
    <div id="news-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Create News Post</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="news-form">
                <div class="modal-body">
                    <input type="hidden" id="news-id">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" required placeholder="Ex: Admission Open 2024">
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="tag">Tag</label>
                            <select id="tag">
                                <option value="Recent">Recent</option>
                                <option value="Important">Important</option>
                                <option value="General">General</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="display_order">Display Order</label>
                            <input type="number" id="display_order" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <label class="switch">
                            <input type="checkbox" id="is_active" checked>
                            <span class="slider"></span>
                        </label>
                        <span style="font-size: 0.8rem; vertical-align: middle; margin-left: 10px;">Visible on Public Site</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save News</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/security.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/news-admin.js"></script>
</body>
</html>
