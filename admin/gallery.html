<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
        <header class="table-header">
            <h1>Campus Gallery</h1>
            <div class="table-actions">
                <input type="file" id="bulk-upload" multiple accept="image/*" style="display:none">
                <button onclick="document.getElementById('bulk-upload').click()" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Bulk Upload
                </button>
            </div>
        </header>

        <div id="gallery-grid" class="gallery-admin-grid">
            <!-- Loaded via JS -->
        </div>
    </main>

    <style>
        .gallery-admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .gallery-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
        }
        .gallery-card img { width: 100%; height: 180px; object-fit: cover; }
        .gallery-card-info { padding: 15px; }
        .gallery-card-info input {
            width: 100%;
            border: 1px solid transparent;
            padding: 5px;
            font-size: 0.85rem;
        }
        .gallery-card-info input:focus { border-color: var(--gray-200); outline: none; }
        .card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            box-shadow: var(--shadow);
        }
        .action-btn.del { color: var(--danger); }
    </style>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/security.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/gallery-admin.js"></script>
</body>
</html>
