<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Settings | Superadmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="admin-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
        <header class="table-header">
            <h1>Site Settings</h1>
        </header>

        <div class="data-table-container">
            <div class="table-header">
                <p style="font-size: 0.85rem; color: var(--gray-500)">Manage global site configuration (SSRF protection active)</p>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 200px;">Key</th>
                        <th>Value</th>
                        <th style="width: 100px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="settings-table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Edit Setting</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="settings-form">
                <div class="modal-body">
                    <input type="hidden" id="setting-id">
                    <div class="form-group">
                        <label id="setting-key-label">Setting Key</label>
                        <input type="text" id="setting-value" required>
                        <small id="ssrf-hint" style="display:none; color:var(--orange)">Note: URL validation is active for this field.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel close-modal">Cancel</button>
                    <button type="submit" class="btn-modal-save">Update Setting</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/security.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/settings-admin.js"></script>
</body>
</html>
